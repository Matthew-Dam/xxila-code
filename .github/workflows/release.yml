# Builds X.X.I.L.A. C.O.D.E from the PRIVATE source repo and publishes the installers here.
# Run it from the Actions tab → "Build & Release" → Run workflow.
#
# Needs one secret in this repo (Settings → Secrets and variables → Actions):
#   SOURCE_TOKEN   a fine-grained token with read-only "Contents" access to xxila-code-src
# Optional repository variables, for the Microsoft Store package (fill in after reserving the name):
#   STORE_IDENTITY_NAME   Package/Identity/Name        (Partner Center → Product identity)
#   STORE_PUBLISHER       Package/Identity/Publisher   (starts with CN=)
#   STORE_PUBLISHER_NAME  Package/Properties/PublisherDisplayName

name: Build & Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch or tag to build (in xxila-code-src)
        default: main
        required: true
      draft:
        description: Create the release as a draft (check it before people see it)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SOURCE_REPO: Matthew-Dam/xxila-code-src

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows,   os: windows-latest }
          - { name: linux,     os: ubuntu-22.04 }
          - { name: mac-arm64, os: macos-15,       arch: arm64 }
          - { name: mac-x64,   os: macos-15-intel, arch: x64 }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.eb-cache
    steps:
      - name: Get source (private repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: app
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Build Windows installer
        if: matrix.name == 'windows'
        working-directory: app
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build Microsoft Store package
        if: matrix.name == 'windows' && vars.STORE_IDENTITY_NAME != ''
        working-directory: app
        shell: pwsh
        run: >
          npx electron-builder --win appx --x64 --publish never
          "-c.appx.identityName=${{ vars.STORE_IDENTITY_NAME }}"
          "-c.appx.publisher=${{ vars.STORE_PUBLISHER }}"
          "-c.appx.publisherDisplayName=${{ vars.STORE_PUBLISHER_NAME }}"

      - name: Build Linux packages
        if: matrix.name == 'linux'
        working-directory: app
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Build macOS app (${{ matrix.arch }})
        if: startsWith(matrix.name, 'mac')
        working-directory: app
        run: |
          npx electron-builder --mac dir --${{ matrix.arch }} --publish never
          APP="$(find release -maxdepth 2 -name '*.app' -type d | head -n 1)"
          echo "Built: $APP"
          # Ad-hoc signature: without any signature Apple Silicon Macs report the app as "damaged".
          codesign --force --deep --sign - "$APP"
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never --prepackaged "$APP"

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          cd app/release
          for f in XXILA-CODE-*.exe *.AppImage *.deb *.dmg; do [ -f "$f" ] && cp "$f" ../../out/; done
          mkdir -p ../../store
          for f in *.appx *.msix; do [ -f "$f" ] && cp "$f" ../../store/; done
          ls -la ../../out ../../store

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows' && vars.STORE_IDENTITY_NAME != ''
        with:
          name: microsoft-store-package
          path: store/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Read version from source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: app
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: v
        run: echo "version=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: files
          merge-multiple: true

      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release v${{ steps.v.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: X.X.I.L.A. C.O.D.E v${{ steps.v.outputs.version }}
          draft: ${{ inputs.draft }}
          make_latest: 'true'
          files: files/*
          body: |
            ## Download

            | System | File |
            |---|---|
            | Windows 10/11 (64-bit) | **XXILA-CODE-Setup-x64.exe** |
            | macOS, Apple Silicon (M1–M4) | **XXILA-CODE-mac-arm64.dmg** |
            | macOS, Intel | **XXILA-CODE-mac-x64.dmg** |
            | Linux (any distro) | **XXILA-CODE-x86_64.AppImage** |
            | Ubuntu / Debian | **xxila-code_amd64.deb** |

            First time opening it? See the install help: https://matthew-dam.github.io/xxila-code/#install

            ## What's new
            See the changelog in the app (Help → About) or on the website.
